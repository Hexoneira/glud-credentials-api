totp:
   secret: ${RANDOM_SEED}
   tenant: ${TENANT}
jwt:
   secret: ${JWT_SECRET}
   expiration: ${JWT_EXPIRATION}
app:
   cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}
   guest:
      max-active: ${GUEST_MAX_ACTIVE:15}
spring:
   application:
     name: credentials
   datasource:
     url: ${DB_URL:jdbc:postgresql://localhost:5432/credentials}
     username: ${DB_USERNAME:postgres}
     password: ${DB_PASSWORD:}
     driver-class-name: org.postgresql.Driver
   jpa:
     hibernate:
       ddl-auto: validate
     show-sql: false
   flyway:
     enabled: true
     locations: classpath:db/migration
