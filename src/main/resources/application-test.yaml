totp:
   secret: ${RANDOM_SEED:default-totp-seed}
   tenant: ${TENANT:default-tenant}
jwt:
   secret: ${JWT_SECRET:default-secret-key-32-bytes-long-base64-encoded-value-for-testing-only}
   expiration: ${JWT_EXPIRATION:86400000}
spring:
   application:
     name: credentials
   datasource:
     url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
     username: sa
     password:
     driver-class-name: org.h2.Driver
   jpa:
     hibernate:
       ddl-auto: create-drop
     show-sql: false
     database-platform: org.hibernate.dialect.H2Dialect
   h2:
     console:
       enabled: false

